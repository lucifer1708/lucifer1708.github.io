<!doctype html>
<html lang="en" data-theme="matrix">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sumit@portfolio:~$</title>
  <meta name="description" content="Portfolio — a Linux desktop in your browser.">
  <meta name="theme-color" content="#050a05">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23050a05'/><text x='12' y='68' font-family='monospace' font-size='56' fill='%2339ff14'>&gt;_</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div id="crt" aria-hidden="true"></div>

  <section id="boot"><pre id="boot-log"></pre></section>

  <div id="wall" aria-hidden="true"><i></i><i></i><i></i><div class="wm-name"></div><div id="spot"></div></div>

  <main id="desktop" hidden>
    <header id="bar">
      <div class="bar-left">
        <button class="pill logo" id="launch-btn" title="Launcher (Alt+Space / Ctrl+K)">&gt;_</button>
        <nav id="workspaces" class="pill"></nav>
      </div>
      <div class="pill" id="bar-title"></div>
      <div class="bar-right">
        <span class="pill" id="cpu"></span>
        <span class="pill" id="mem"></span>
        <span class="pill hide-sm">⇅ <b>eth0</b></span>
        <span class="pill" id="clock"></span>
        <button class="pill" id="st-btn" title="settings (Alt+S)">⚙</button>
        <button class="pill" id="wp-next" title="next wallpaper (Alt+W)">🖼</button>
        <button class="pill pw" id="power" title="reboot">⏻</button>
      </div>
    </header>
    <div id="screens"></div>
  </main>

  <div id="launcher" hidden>
    <div class="l-box" role="dialog" aria-label="launcher">
      <div class="l-in"><span class="accent">❯</span><input id="l-q" placeholder="search workspaces, projects, themes, commands…" autocomplete="off" spellcheck="false"></div>
      <ul id="l-list"></ul>
      <div class="l-foot dim">↑↓ navigate · enter run · esc close</div>
    </div>
  </div>
  <aside id="settings" hidden aria-label="settings">
    <div class="st-head"><span class="accent">⚙</span> hyprctl <span class="dim">— settings</span><button class="pill" id="st-close" title="close (Esc)">✕</button></div>
    <div class="st-body" id="st-body"></div>
  </aside>
  <div id="notify" aria-live="polite"></div>

  <noscript><pre style="color:#39ff14;padding:2rem">kernel panic: JavaScript not found. Enable JS to boot.</pre></noscript>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
